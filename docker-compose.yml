# Two ways to run the containerised app.
#
# Hosted LLM (the deployed configuration):
#   GROQ_API_KEY=... docker compose up app
#
# Fully local, nothing leaves the machine (app + Ollama in containers):
#   LLM_PROVIDER=ollama docker compose --profile local up
#   (first start pulls qwen3:4b, ~2.5GB; uncomment the GPU block for NVIDIA)
#
# Then open http://localhost:7860

services:
  app:
    build: .
    image: uk-rental-law-rag:local
    ports:
      - "7860:7860"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
      # Local use: no public-demo throttling.
      RATE_LIMIT_PER_MINUTE: "0"
      DAILY_QUERY_LIMIT: "0"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
        required: false
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.16
    profiles: [local]
    volumes:
      - ollama:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: make sure the model is present before the app starts.
  ollama-pull:
    image: ollama/ollama:0.40.16
    profiles: [local]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${RAG_MODEL:-qwen3:4b}"]
    depends_on:
      - ollama

volumes:
  ollama:
