name: Deploy to Hugging Face Spaces

# After CI passes on main, push the app to a Docker Space and smoke-test the
# live URL. Configure once in the GitHub repo settings:
#   secret   HF_TOKEN       Hugging Face access token with write scope
#   variable HF_SPACE       e.g. your-hf-username/uk-rental-law-rag
#   secret   GROQ_API_KEY   synced to the Space as a Space secret
# Skips cleanly until HF_TOKEN and HF_SPACE are set.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: huggingface-space
      url: ${{ steps.deploy.outputs.url }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice::HF_TOKEN secret or HF_SPACE variable not set - skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Deploy
        id: deploy
        if: steps.cfg.outputs.skip != 'true'
        run: |
          pip install "huggingface_hub==0.36.2"
          python scripts/deploy_space.py --sha "${{ github.event.workflow_run.head_sha || github.sha }}"
