[project]
name = "uk-rental-law-rag"
version = "0.2.0"
description = "Source-grounded RAG assistant for England residential landlord-tenant law"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "eval"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["venv", "data", "documents"]

[tool.ruff.lint]
# Correctness-focused: syntax errors, undefined names, unused imports/variables,
# and a few bug-prone patterns. Style is left to review.
select = ["E9", "F", "B006", "B008", "B904"]
ignore = ["F541"]
